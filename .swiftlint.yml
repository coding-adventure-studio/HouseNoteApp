excluded:
  - Pods
  - DerivedData
  - Carthage

analyzer_rules:
  - unused_declaration

opt_in_rules:
  - function_parameter_count
  - empty_count
  - explicit_init
  - redundant_nil_coalescing
  - trailing_comma
  - line_length
  - identifier_name
  - array_init
  - closure_spacing
  - unused_setter_value
  - vertical_parameter_alignment_on_call
  - attributes
  - sorted_imports
  - first_where

analyzer_rules:
  - unused_declaration

function_parameter_count:
  warning: 4
  error: 6

identifier_name:
  min_length: 2
  excluded: ["x", "y", "id"]

line_length:
  warning: 100
  error: 120
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  ignores_case_statements: true

function_body_length:
  warning: 80
  error: 160

trailing_comma:
  mandatory_comma: true

trailing_whitespace:
  ignores_empty_lines: true

empty_count:
  only_after_dot: true

reporter: xcode
